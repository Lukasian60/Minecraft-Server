<!DOCTYPE html>
<html>
    <head>
        <title>Ranglisten</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-0.9" >
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/jpeg" href="favicon.jpg" >
    </head>
    <body>

        <header>
            <h1>Ranglisten</h1>
        </header>

        <hr>

        <nav>
            <button class="button"><a href="index.html"><p class="buttonfont">Startseite</p></a></button>
        </nav>
        
        <hr>

        <main>
          
          <p class="playtimetitle"> Spielzeit </p>

<!-- Playtime table -->
<div class="tbl-wrap playtime-wrap">
  <table>
    <thead>
      <tr>
        <th class="rank">#</th>
        <th>Name</th>
        <th>Tag</th>
        <th style="text-align:right">Spielzeit</th>
        <th class="bar-cell"></th>
      </tr>
    </thead>
    <tbody id="playtime-tbody"></tbody>
  </table>
</div>
<script>
(function () {
  const data = [
    { name: "Fabi",     tag: "FaBiUs555",          mins: 91*60+11 },
    { name: "Lilly",    tag: "Legoten",            mins: 62*60+29 },
    { name: "Lukas",    tag: "Lukasian06",         mins: 61*60+37 },
    { name: "Tim",      tag: "Tim184GHG",          mins: 47*60+39 },
    { name: "Dorian",   tag: "cxkdorian9",         mins: 43*60+29 },
    { name: "Tobi",     tag: "ToibiusGHG",         mins: 40*60+53 },
    { name: "Isabella", tag: "ISABELLAIA",         mins: 38*60+15 },
    { name: "Luis",     tag: "Luistod",            mins: 36*60+44 },
    { name: "Isak",     tag: "Dab3di",             mins: 31*60+57 },
    { name: "Fränzl",   tag: "Maxi2503",           mins: 31*60+39 },
    { name: "Simon",    tag: "Seikower",           mins: 30*60+59 },
    { name: "David",    tag: "Streifenh0rnchen",   mins: 29*60+27 },
    { name: "Alex",     tag: "TiredArrow65776",    mins: 26*60+20 },
    { name: "Yosef",    tag: "R3ealm",             mins: 25*60+10 },
    { name: "Elias",    tag: "Eleasyy",            mins: 20*60+26 },
    { name: "Jan",      tag: "ASV13Jan",           mins: 9*60+40  },
    { name: "Vivi",     tag: "Viv_2409",           mins: 7*60+41  },
    { name: "Nati",     tag: "itan5968",           mins: 4*60+2   },
    { name: "Marie",    tag: "Skibidimarii",       mins: 9        },
    { name: "Helene",   tag: "helene138797",       mins: 0        },

  ];

  // Highest playtime first
  data.sort((a, b) => b.mins - a.mins);

  const max = data[0].mins;
  const rankClass = i => i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
  const fmtTime = m => {
    if (m === 0) return '—';
    if (m < 60) return m + 'min';
    return Math.floor(m / 60) + 'h ' + (m % 60) + 'min';
  };

  const tbody = document.getElementById('playtime-tbody');
  data.forEach((p, i) => {
    const pct = max > 0 ? Math.round((p.mins / max) * 100) : 0;
    const rc = rankClass(i);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="rank ${rc}">${i + 1}</td>
      <td class="name">${p.name}</td>
      <td class="tag">${p.tag}</td>
      <td class="time ${p.mins === 0 ? 'zero' : ''}">${fmtTime(p.mins)}</td>
      <td class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div></td>
    `;
    tbody.appendChild(tr);
  });
})();
</script>



<p class="playtimetxt">Die Rangliste ist Stand 9.7.2026 11:10</p>
<hr>
<p class="deathstitle"> Tode </p>




<!-- Death table -->
<div class="tbl-wrap deaths-wrap">
  <table>
    <thead>
      <tr>
        <th class="rank">#</th>
        <th>Name</th>
        <th>Tag</th>
        <th style="text-align:right">Tode</th>
        <th class="bar-cell"></th>
      </tr>
    </thead>
    <tbody id="death-tbody"></tbody>
  </table>
</div>

<script>
(function () {
  const data = [

    { name: "Isabella", tag: "ISABELLAIA",         deaths:0  },
    { name: "Elias",    tag: "Eleasyy",            deaths:0  },
    { name: "Tim",      tag: "Tim184GHG",          deaths:0  },
    { name: "Simon",    tag: "Seikower",           deaths:1  },
    { name: "Dorian",   tag: "cxkdorian9",         deaths:1  },
    { name: "Tobi",     tag: "ToibiusGHG",         deaths:2  },
    { name: "Fränzl",   tag: "Maxi2503",           deaths:2  },
    { name: "David",    tag: "Streifenh0rnchen",   deaths:3  },
    { name: "Vivi",     tag: "Viv_2409",           deaths:4  },
    { name: "Nati",     tag: "itan5968",           deaths:5  },
    { name: "Fabi",     tag: "FaBiUs555",          deaths:6  },
    { name: "Lukas",    tag: "Lukasian06",         deaths:6  },
    { name: "Yosef",    tag: "R3ealm",             deaths:6  },
    { name: "Jan",      tag: "ASV13Jan",           deaths:7  },
    { name: "Marie",    tag: "Skibidimarii",       deaths:8  },
    { name: "Luis",     tag: "Luistod",            deaths:8  },
    { name: "Lilly",    tag: "Legoten",            deaths:11 },
    { name: "Alex",     tag: "TiredArrow65776",    deaths:19 },
    { name: "Isak",     tag: "Dab3di",             deaths:42 },
];

// Fewest deaths first
  data.sort((a, b) => a.deaths - b.deaths);

  const max = Math.max(...data.map(p => p.deaths));
  const rankClass = r => r === 1 ? 'gold' : r === 2 ? 'silver' : r === 3 ? 'bronze' : '';

  const tbody = document.getElementById('death-tbody');

  let currentRank = 0;
  let lastDeaths = null;

  data.forEach((p) => {
    // Dense ranking: rank only increments by 1 when the value changes
    if (p.deaths !== lastDeaths) {
      currentRank += 1;
      lastDeaths = p.deaths;
    }

    const rawPct = max > 0 ? Math.round((p.deaths / max) * 100) : 0;
    const pct = 100 - rawPct; // inverted: fewer deaths = fuller bar
    const rc = rankClass(currentRank);
    const isFlawless = p.deaths === 0;
    const tr = document.createElement('tr');
    if (isFlawless) tr.classList.add('flawless-row');

    const deathsCell = isFlawless
      ? `<span class="flawless-badge"><i class="ti ti-shield-check"></i> none</span>`
      : p.deaths.toString();

    tr.innerHTML = `
      <td class="rank ${rc}">${currentRank}</td>
      <td class="name">${p.name}</td>
      <td class="tag">${p.tag}</td>
      <td class="deaths ${isFlawless ? 'flawless' : ''}">${deathsCell}</td>
      <td class="bar-cell"><div class="bar-bg"><div class="bar-fill ${isFlawless ? 'flawless-fill' : ''}" style="width:${pct}%"></div></div></td>
    `;
    tbody.appendChild(tr);
  });
})();

</script>

        </main>
        <p class="deathstxt">Die Rangliste ist Stand 9.7.2026 11:10  ///  Die Tode werden ab dem 27.6.2026 11:00 gezählt.</h5>
    </body>
        <footer>
        <hr>
        </footer>
</html>
